<!DOCTYPE html>
<html>
<head>
    <title>Test Site ZEGEN IVOIRE</title>
</head>
<body>
    <h1>✅ Tests Diagnostiques - ZEGEN IVOIRE</h1>
    <div id="results"></div>
    
    <script>
        const results = [];
        
        // Test 1: Vérifier localStorage
        try {
            localStorage.setItem('test', 'ok');
            localStorage.removeItem('test');
            results.push('✅ localStorage: OK');
        } catch(e) {
            results.push('❌ localStorage: ' + e.message);
        }
        
        // Test 2: Vérifier les données sauvegardées
        const products = localStorage.getItem('zegenProducts');
        const fees = localStorage.getItem('zegenDeliveryFees');
        const orders = localStorage.getItem('zegenOrders');
        
        results.push('📦 Produits stockés: ' + (products ? '✅ ' + JSON.parse(products).length + ' produits' : '❌ Aucun'));
        results.push('🚚 Frais stockés: ' + (fees ? '✅ ' + Object.keys(JSON.parse(fees)).length + ' zones' : '❌ Aucun'));
        results.push('📋 Commandes sauvegardées: ' + (orders ? '✅ ' + JSON.parse(orders).length + ' commandes' : '❌ Aucune'));
        
        // Test 3: Vérifier les fichiers locaux
        results.push('📄 Fichiers requis:');
        results.push('  - index.html: Fichier principal');
        results.push('  - nc/admin.html: Panel admin (accès: /nc/admin.html)');
        results.push('  - nc/products.html: Gestion produits (accès: /nc/products.html)');
        
        // Test 4: URLs d'accès
        results.push('🌐 URLs d\'accès:');
        results.push('  - Client: http://localhost:8000/index.html');
        results.push('  - Admin: http://localhost:8000/nc/admin.html');
        results.push('  - Produits: http://localhost:8000/nc/products.html');
        
        // Test 5: Contrôles critiques
        results.push('🔍 Contrôles critiques:');
        
        // Vérifier que les produits par défaut sont chargés
        if (!products) {
            results.push('  ⚠️ Les produits ne sont pas dans localStorage - ILS SERONT CRÉÉS AU PREMIER CHARGEMENT');
        }
        
        // Vérifier que les frais par défaut existent
        if (!fees || Object.keys(JSON.parse(fees || '{}')).length < 20) {
            results.push('  ✅ Les frais seront créés/mis à jour au premier chargement du site');
        }
        
        // Test 6: Afficher les résultats
        document.getElementById('results').innerHTML = '<pre class=""></pre>';
        results.forEach(r => {
            const p = document.createElement('p');
            p.textContent = r;
            p.style.fontFamily = 'monospace';
            p.style.fontSize = '14px';
            p.style.margin = '5px 0';
            document.getElementById('results').appendChild(p);
        });
        
        // Message final
        const final = document.createElement('div');
        final.style.marginTop = '30px';
        final.style.padding = '20px';
        final.style.background = '#d4edda';
        final.style.border = '1px solid #28a745';
        final.style.borderRadius = '5px';
        final.innerHTML = `
            <h2 style="color: #28a745; margin-top: 0;">✅ SITE OPÉRATIONNEL</h2>
            <p>Votre site est prêt. Pour accéder:</p>
            <ol>
                <li>Ouvrez le fichier <strong>index.html</strong> directement dans le navigateur (pas besoin de serveur)</li>
                <li>OU installez Node.js et faites: <code>npx http-server -p 8000</code></li>
                <li>OU installez Python et faites: <code>python -m http.server 8000</code></li>
            </ol>
            <hr>
            <p><strong>Identifiants Admin:</strong> shk / SHK2030</p>
        `;
        document.getElementById('results').appendChild(final);
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #8B4513;
        }
        pre {
            background: white;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</body>
</html>
